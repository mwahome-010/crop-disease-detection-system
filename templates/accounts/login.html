{% extends 'base.html' %}
{% block title %}
    Log in
{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-green" type="submit">Log in</button>
  </form>
  <p>No account? <a href="{% url 'register' %}">Register</a></p>
</section>
{% endblock %}
